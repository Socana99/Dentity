name: dental_history_app
description: Historia clínica dental digital, dinámica, con soporte para lápiz/stylus y teclado.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Persistencia local
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Estado
  provider: ^6.1.2

  # Utilidades
  uuid: ^4.4.0
  intl: ^0.19.0

  # Sincronización + autenticación en la nube
  supabase_flutter: ^2.5.9

  # Exportar historia clínica a PDF
  pdf: ^3.11.0
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
